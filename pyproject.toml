[project]
name = "swarmcontrol"
version = "0.1.2"
description = "The control loop for AI agent swarms: per-agent laws enforced before actions run, live health, and training data from every correction."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ayush Chaurasia" }]
keywords = ["ai-agents", "governance", "claude-code", "guardrails", "bend", "formal-verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=2.8",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/AyushExel/swarmcontrol"
Repository = "https://github.com/AyushExel/swarmcontrol"
Issues = "https://github.com/AyushExel/swarmcontrol/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
swctl = "swarmcontrol.cli:main"
swarmcontrol = "swarmcontrol.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmcontrol"]
# the dashboard build is gitignored but ships in the wheel: run `npm run build` before building
artifacts = ["src/swarmcontrol/web/**"]

[tool.hatch.build.targets.sdist]
include = ["src/swarmcontrol", "pytests", "README.md", "pyproject.toml", "LICENSE", "NOTICE"]
artifacts = ["src/swarmcontrol/web/**"]

[tool.pytest.ini_options]
testpaths = ["pytests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
